<script>
/* Shtresa e pavarur: jashtë Claude, të dhënat ruhen në shfletues (localStorage) */
(function(){
  if(window.claude&&typeof window.claude.use==="function")return;
  window.__STANDALONE=true;
  window.__TEACHER=/^#mesues-/.test(location.hash);
  const P="regjistri2026:",subs={};
  const rd=k=>{try{const x=localStorage.getItem(P+k);return x?JSON.parse(x):null;}catch(e){return null;}};
  const wr=(k,v)=>{try{localStorage.setItem(P+k,JSON.stringify(v));}catch(e){throw {code:"storage",message:"Shfletuesi nuk lejon ruajtjen (hapje private ose hapësira e mbushur)."};}};
  const all=c=>rd("c:"+c)||{};
  const snapOf=c=>{const m=all(c);return {docs:Object.keys(m).map(id=>({id,data:()=>m[id]}))};};
  const notify=c=>(subs[c]||[]).forEach(f=>{try{f(snapOf(c));}catch(e){console.error(e);}});
  const clone=d=>JSON.parse(JSON.stringify(d));
  const merge=(a,b)=>{const o=Object.assign({},a);for(const k in b){if(k==="__proto__")continue;const v=b[k];o[k]=(v&&typeof v==="object"&&!Array.isArray(v)&&o[k]&&typeof o[k]==="object")?merge(o[k],v):v;}return o;};
  const db={collection:c=>({
    doc:id=>({
      get:async()=>{const m=all(c);return {exists:id in m,data:()=>m[id]};},
      set:async(d,o)=>{const m=all(c);m[id]=(o&&o.merge)?merge(m[id]||{},clone(d)):clone(d);wr("c:"+c,m);notify(c);},
      update:async d=>{const m=all(c);m[id]=merge(m[id]||{},clone(d));wr("c:"+c,m);notify(c);}
    }),
    onSnapshot:cb=>{(subs[c]=subs[c]||[]).push(cb);setTimeout(()=>cb(snapOf(c)),0);return()=>{subs[c]=subs[c].filter(f=>f!==cb);};}
  })};
  const user={id:async()=>"local",canEdit:async()=>!window.__TEACHER};
  const downloads={save:async({filename,data})=>{
    const type=/\.csv$/i.test(filename)?"text/csv;charset=utf-8":/\.json$/i.test(filename)?"application/json":"text/html;charset=utf-8";
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=filename;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}};
  const caps={db,user,downloads};
  window.claude={use:async n=>caps[n]};
  window.__BK={P};

  /* ---- Firebase (kur është vendosur konfigurimi dhe faqja hapet online) ---- */
  const CFG=window.FIREBASE_CONFIG||{};
  if(CFG.projectId&&location.protocol!=="file:"){
    window.__STANDALONE=false;
    if(typeof firebase==="undefined"){
      window.__FBERR="nuk u ngarkua Firebase (kontrollo lidhjen me internetin).";
      window.claude={use:async n=>n==="downloads"?downloads:null};
    }else{
      if(!firebase.apps.length)firebase.initializeApp(CFG);
      const auth=firebase.auth(),fs=firebase.firestore();
      window.__FB_AUTH=auth;
      const fdb={collection:c=>({
        doc:id=>{const r=fs.collection(c).doc(id);return {get:()=>r.get(),set:(d,o)=>r.set(clone(d),o),update:d=>r.update(clone(d))};},
        onSnapshot:(cb,err)=>fs.collection(c).onSnapshot(cb,err)
      })};
      const firstUser=()=>new Promise(res=>{const off=auth.onAuthStateChanged(x=>{off();res(x);});});
      const $i=id=>document.getElementById(id);
      const loginUI=()=>new Promise(res=>{
        $i("view").innerHTML='<div class="panel" style="max-width:380px;margin:30px auto"><h2>Hyrje në regjistër</h2><label class="f">Email<input id="lgE" type="email" autocomplete="username"></label><label class="f" style="margin-top:10px">Fjalëkalimi<input id="lgP" type="password" autocomplete="current-password"></label><p class="msg" id="lgM" style="margin:8px 0"></p><button class="btn primary" id="lgGo">Hyr</button></div>';
        const go=async()=>{const m=$i("lgM");m.className="msg";m.textContent="Duke hyrë…";
          try{const r=await auth.signInWithEmailAndPassword($i("lgE").value.trim(),$i("lgP").value);res(r.user);}
          catch(e){m.className="msg err";m.textContent="Nuk u hap: "+(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(e.code||"")?"email ose fjalëkalim i gabuar.":(e.code||e.message));}};
        $i("lgGo").onclick=go;$i("lgP").onkeydown=e=>{if(e.key==="Enter")go();};
      });
      let ready=null;
      const waitAuth=()=>ready||(ready=(async()=>{
        let u=await firstUser();
        if(window.__TEACHER){if(!u)u=(await auth.signInAnonymously()).user;return u;}
        while(!u||u.isAnonymous)u=await loginUI();
        return u;
      })().catch(e=>{window.__FBERR=(e&&(e.code||e.message))||String(e);throw e;}));
      window.claude={use:async n=>{
        if(n==="downloads")return downloads;
        await waitAuth();
        if(n==="db")return fdb;
        if(n==="user")return {id:async()=>auth.currentUser.uid,canEdit:async()=>!window.__TEACHER&&!!auth.currentUser&&!auth.currentUser.isAnonymous};
        return null;
      }};
    }
  }
})();

function scoreOf(doc){
  const sc=doc.scores||{};let sum=0,n=0;const groups={};
  for(const g of INSTR){let gs=0,gn=0;g.i.forEach((_,k)=>{const v=sc[gkey(g,k)]||sc[g.id+"."+k];if(v){gs+=v;gn++;}});if(gn)groups[g.id]=Math.round(gs/(4*gn)*100);sum+=gs;n+=gn;}
  return {pct:n?Math.round(sum/(4*n)*100):null,n,groups};
}

function taskStatus(t){if(taskDone(t.id))return["Kryer","good"];const td=today();if(t.e&&t.e<td)return["Vonuar","bad"];if(t.s&&t.s<=td&&(!t.e||t.e>=td))return["Në afat","acc"];return t.s?["Më vonë",""]:["I vazhdueshëm",""];}

/* ---------- Ruajtja ---------- */
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout",message:"Serveri nuk u përgjigj brenda "+ms/1000+" sekondave."}),ms))]);}
function errText(e){return (e&&(e.code||e.name)?"("+(e.code||e.name)+") ":"")+(e&&e.message?e.message:String(e||""));}
async function setDoc(coll,id,data){
  if(!db){toast("Ruajtja nuk është e lidhur: faqja nuk e ka bazën e të dhënave. Hape nga llogaria jote.");return {ok:false,err:"db-null"};}
  try{await withTimeout(db.collection(coll).doc(id).set(data),12000);return {ok:true};}
  catch(e){console.error("set "+coll+"/"+id,e);return {ok:false,err:errText(e)};}
}
async function saveSelf(id,data){
  if(!db)throw {code:"db-null",message:"Ruajtja nuk është e disponueshme."};
  if(!uid&&user)uid=await user.id();
  if(!uid)throw {code:"no-user",message:"Duhet të hysh me llogarinë tënde për të dërguar vetëvlerësimin."};
  const ref=db.collection("selfeval").doc(uid);
  const payload={forms:{[id]:data}};
  await withTimeout(ref.set(payload,{merge:true}),12000);
}

/* ---------- Tekste model ---------- */
function defaultTexts(d,pcts){
  const g=INSTR.filter(x=>pcts&&pcts[x.id]!=null);
  if(g.length){
    const strong=g.filter(x=>pcts[x.id]>=75).sort((a,b)=>pcts[b.id]-pcts[a.id]).slice(0,3);
    const weak=g.filter(x=>pcts[x.id]<75).sort((a,b)=>pcts[a.id]-pcts[b.id]).slice(0,3);
    const strengths=strong.length?strong.map(x=>"• "+x.id+" "+x.t+" ("+pcts[x.id]+"%): "+MODEL[x.id].s+".").join("\n"):"• Ora u zhvillua në një klimë pune të qetë dhe nxënësit u përfshinë në veprimtari.";
    const improve=weak.length?weak.map(x=>"• "+x.id+" "+x.t+" ("+pcts[x.id]+"%): "+MODEL[x.id].i+".").join("\n"):"• Nuk ka fusha me nivel të ulët; vazhdoni me diferencimin dhe pyetjet e nivelit të lartë.";
    const due=fmtShort(addDays(d.date||today(),14));
    const recs=(weak.length?weak.map((x,i)=>(i+1)+". "+MODEL[x.id].r+" (afati: "+due+")").join("\n")+"\n"+(weak.length+1)+". ":"1. ")+"Diskutim i ndjekjes së rekomandimeve me nëndrejtorin brenda 2 javësh.";
    return {strengths,improve,recs};
  }
  const due=fmtShort(addDays(d.date||today(),14));
  return {
   strengths:"• Ora nisi në kohë dhe u zhvillua në një klimë pozitive pune.\n• Qëllimi i orës u njoftua dhe nxënësit u përfshinë në veprimtari.\n• Përmbajtja shkencore u trajtua saktë dhe me shembuj të përshtatshëm.\n• [Shto ose ndrysho pikat sipas orës së vëzhguar.]",
   improve:"• Diferencimi i detyrave sipas nivelit të nxënësve.\n• Përdorimi më i shpeshtë i pyetjeve të nivelit të lartë.\n• Përdorimi i TIK-ut ose i mjeteve mësimore.\n• [Shto ose ndrysho pikat sipas orës së vëzhguar.]",
   recs:"1. Të përfshihen në planin ditor detyra të diferencuara për nivele të ndryshme (afati: "+due+").\n2. Të përdoren pyetje të nivelit të lartë dhe të paktën një mjet mësimor ose TIK në çdo orë të re (afati: "+due+").\n3. Diskutim i ndjekjes së rekomandimeve me nëndrejtorin brenda 2 javësh."
  };
}

function render(){
  const tabs=$("#tabs"),hb=$("#hdrbtns");
  if(state.isAdmin===null){view.innerHTML=`<div class="empty">Duke u ngarkuar…</div>`;return;}
  if(!state.isAdmin){tabs.hidden=true;hb.hidden=true;$("#title").textContent=state.vv?"Vetëvlerësimi i mësuesit pas orës":"Regjistri i nëndrejtorit";
    view.innerHTML=state.vv?selfView(false):`<div class="panel"><p>Ky është regjistër privat i nëndrejtorit. Nëse ke marrë një lidhje vetëvlerësimi, hape përsëri atë lidhje.</p></div>`;
    if(state.vv)bindSelf(false);return;}
  tabs.hidden=false;hb.hidden=false;$("#title").textContent="Regjistri i nëndrejtorit";
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===state.tab));
  if(state.vv){view.innerHTML=selfView(true);bindSelf(true);return;}
  if(state.tab==="monitorimi"&&state.openObj){view.innerHTML=formView();bindForm();return;}
  view.innerHTML=({pasqyra,monitorimi,veprimtarite,matura,mesuesit})[state.tab]();
  ({pasqyra:bindOverview,monitorimi:bindMon,veprimtarite:bindTasks,matura:bindMatura,mesuesit:bindTeachers})[state.tab]();
}

function pasqyra(){
  const obs=allObs();const planned=obs.filter(o=>!o.extra);const done=planned.filter(o=>o.doc.status==="kryer").length;
  const extra=obs.filter(o=>o.extra&&o.doc.status==="kryer").length;
  const tdone=TASKS.filter(t=>taskDone(t.id)).length, tover=TASKS.filter(t=>!taskDone(t.id)&&t.e&&t.e<today()).length;
  const lateObs=planned.filter(o=>statusOf(o)==="vonuar").length;
  const mdone=MCLASSES.reduce((a,c)=>a+MSTEPS.filter(s=>((state.matDocs[mkey(c)]||{}).steps||{})[s[0]]).length,0), mtot=MCLASSES.length*MSTEPS.length;
  const scored=obs.filter(o=>o.doc.status==="kryer").map(o=>scoreOf(o.doc).pct).filter(p=>p!=null);
  const avg=scored.length?Math.round(scored.reduce((a,b)=>a+b,0)/scored.length):null;
  const selfN=Object.keys(state.selfForms).length;
  const tile=(n,l,p)=>`<div class="tile"><div class="n">${n}</div><div class="l">${l}</div>${p!=null?`<div class="bar"><i style="width:${p}%"></i></div>`:""}</div>`;
  const upcoming=planned.filter(o=>o.doc.status!=="kryer"&&o.doc.status!=="pa-kryer"&&o.date>=today()).slice(0,6);
  const late=planned.filter(o=>statusOf(o)==="vonuar").slice(0,6);
  const taskLate=TASKS.filter(t=>!taskDone(t.id)&&t.e&&t.e<today()).slice(0,6);
  const taskNow=TASKS.filter(t=>!taskDone(t.id)&&t.s&&t.s<=today()&&t.e&&t.e>=today()).slice(0,6);
  const orow=o=>`<tr class="row" data-open="${esc(o.id)}"><td class="mono">${fmt(o.date)}</td><td>${esc(o.teacher)}<div class="muted" style="font-size:13px">${esc(o.subject)} · ${esc(o.klasa)}</div></td><td class="mono">${esc(o.ora)}</td></tr>`;
  const trow=t=>`<div class="task" style="grid-template-columns:1fr"><div>${esc(t.t)}</div><div class="muted" style="font-size:13px">${esc(t.k)} · ${esc(t.g)}</div></div>`;
  const periodBars=[1,2].map(c=>{const n=planned.filter(o=>o.cycle===c).length;const d=planned.filter(o=>o.cycle===c&&o.doc.status==="kryer").length;return `<div style="margin-top:10px"><div style="display:flex;justify-content:space-between"><span>Monitorimi i ${c===1?"parë":"dytë"}</span><span class="mono">${d}/${n}</span></div><div class="bar"><i style="width:${n?d/n*100:0}%"></i></div></div>`;}).join("");
  return `
  <div class="tiles">
    ${tile(done+"/32","Vëzhgime të kryera"+(extra?` (+${extra} shtesë)`:""),done/32*100)}
    ${tile(avg==null?"–":avg+"%","Mesatarja e vëzhgimeve"+(avg==null?"":" · "+levelOf(avg)),avg)}
    ${tile(selfN,"Vetëvlerësime nga mësuesit",null)}
    ${tile(tdone+"/"+TASKS.length,"Veprimtari të planit të kryera",tdone/TASKS.length*100)}
    ${tile(tover+lateObs,"Të vonuara (veprimtari + vëzhgime)",null)}
    ${tile(mdone+"/"+mtot,"Hapa Matura të përfunduar",mdone/mtot*100)}
  </div>
  <div class="two">
    <section class="panel"><h2>Vëzhgimet e radhës</h2>
      ${upcoming.length?`<div class="tablewrap" style="border:0"><table style="min-width:0"><tbody>${upcoming.map(orow).join("")}</tbody></table></div>`:`<div class="empty">Nuk ka vëzhgime të planifikuara pas sotit.</div>`}
      ${late.length?`<h3 style="margin:14px 0 4px;color:var(--bad)">Vonuar</h3><div class="tablewrap" style="border:0"><table style="min-width:0"><tbody>${late.map(orow).join("")}</tbody></table></div>`:""}
    </section>
    <section class="panel"><h2>Veprimtari për këtë kohë</h2>
      ${taskNow.length?taskNow.map(trow).join(""):`<div class="empty">Asnjë veprimtari e hapur sot.</div>`}
      ${taskLate.length?`<h3 style="margin:14px 0 4px;color:var(--bad)">Vonuar</h3>${taskLate.map(trow).join("")}`:""}
    </section>
    <section class="panel"><h2>Ecuria e monitorimit</h2>${periodBars}<p class="legend">Periudha III është për vëzhgime rishikuese, sipas rekomandimeve.</p></section>
  </div>`;
}

  if(f.status!=="all")obs=obs.filter(o=>statusOf(o)===f.status);
  const chip=(k,v,l)=>`<button class="chip" data-f="${k}" data-v="${v}" aria-pressed="${f[k]===v}">${l}</button>`;
  const rows=obs.map(o=>{const s=statusOf(o),sc=scoreOf(o.doc),lv=levelOf(sc.pct);const [st,cl]=STAT[s];const sf=state.selfForms[o.id];

  </div>
  <div class="filters">
    ${chip("status","all","Çdo gjendje")}${chip("status","planifikuar","Planifikuar")}${chip("status","kryer","Kryer")}${chip("status","vonuar","Vonuar")}${chip("status","shtyrë","Shtyrë")}
    <select id="fteacher" aria-label="Mësuesi" class="btn"><option value="all">Çdo mësues</option>${teachers.map(t=>`<option ${f.teacher===t?"selected":""}>${esc(t)}</option>`).join("")}</select>
    <button class="btn primary small" id="addExtra">+ Vëzhgim shtesë</button>
  </div>
  <div class="tablewrap"><table><thead><tr><th>Data</th><th>Mësuesi/ja</th><th>Lënda</th><th>Klasa</th><th>Ora</th><th>Shkolla</th><th>Gjendja</th><th>Rezultati</th></tr></thead><tbody>${rows||`<tr><td colspan="8" class="empty">Asnjë vëzhgim me këto filtra.</td></tr>`}</tbody></table></div>
  <p class="legend">Kliko një rresht për të hapur instrumentin e vëzhgimit. Në fund të orës: plotëso nivelet, rrishiko tekstet model dhe shtyp "Ruaj".</p>`;

function bindMon(){
  view.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{state.filter[b.dataset.f]=b.dataset.v;render();});

  $("#addExtra").onclick=()=>{const id="x-"+Date.now().toString(36);state.openId=id;state.openObj={id,date:today(),planDate:today(),teacher:Object.keys(TEACHERS).sort()[0],subject:"",klasa:"",ora:"",shift:"Dita",cycle:3,extra:true,doc:{}};state.draft=null;state.tab="monitorimi";render();window.scrollTo(0,0);};
}
function openObs(id){
  const o=allObs().find(x=>x.id===id);if(!o)return;
  state.openId=id;state.openObj=o;state.draft=null;state.tab="monitorimi";state.vv=null;history.replaceState(null,"","#monitorimi");render();window.scrollTo(0,0);
}
function draftOf(){
  if(!state.draft){const o=state.openObj,d=o.doc||{};
    const base={status:d.status||"kryer",date:o.date,klasa:o.klasa,ora:o.ora,shift:o.shift,teacher:o.teacher,subject:o.subject||(TEACHERS[o.teacher]||[""])[0],
      tema:d.tema||"",objektivi:d.objektivi||"",lloji:d.lloji||"Mësim i ri",total:d.total||"",present:d.present||"",duration:d.duration||"45",
      scores:{...(d.scores||{})},ev:{...(d.ev||{})},strengths:d.strengths||"",improve:d.improve||"",recs:d.recs||"",recsDue:d.recsDue||"",recsDone:!!d.recsDone,discussedOn:d.discussedOn||"",followup:!!d.followup,savedAt:d.savedAt||""};
    if(!base.strengths&&!base.improve&&!base.recs){Object.assign(base,defaultTexts(base,null));base.isModel=true;}
    state.draft=base;}
  return state.draft;
}

  return `<div class="filters">${chip("all","Të gjitha")}${chip("hapur","Të pakryera")}${chip("vonuar","Vonuar")}${groups.map(g=>chip(g,g)).join("")}</div>

  <tr><th>Data</th><td>${esc(fmt(d.date||o.date))}</td><th>Klasa</th><td>${esc(d.klasa||o.klasa)}</td></tr>
  <tr><th>Ora</th><td>${esc(d.ora||o.ora)}</td><th>Shkolla</th><td>${esc(d.shift||o.shift)}</td></tr>
  <tr><th>Tema e orës</th><td colspan="3">${esc(d.tema)}</td></tr><tr><th>Qëllimi i orës</th><td colspan="3">${esc(d.objektivi)}</td></tr>
  <tr><th>Lloji i orës</th><td>${esc(d.lloji)}</td><th>Nxënës</th><td>${esc(d.present)} të pranishëm nga ${esc(d.total)} · vëzhgim ${esc(d.duration)} min</td></tr></table>
  <h2>Instrumenti i vëzhgimit (Fusha 2, ASCAP)</h2>
  <div class="sm">Shkalla: 4 shumë mirë, 3 mirë, 2 mjaftueshëm, 1 dobët.</div>
  <table><tr><th>Treguesi</th><th class="num" colspan="2">Niveli</th></tr>${rows}
  <tr class="gh"><td>Rezultati i përgjithshëm</td><td class="num" colspan="2">${sc.pct==null?"–":sc.pct+"% · "+lv}</td></tr></table>
  <h3>Pikat e forta</h3><div class="box">${nl(d.strengths)}</div>
  <h3>Fushat për përmirësim</h3><div class="box">${nl(d.improve)}</div>
  <h3>Rekomandime</h3><div class="box">${nl(d.recs)}</div>
  <table><tr><th>Diskutuar me mësuesin më</th><td>${esc(fmtShort(d.discussedOn))}</td><th>Afati i rekomandimeve</th><td>${esc(fmtShort(d.recsDue))}</td></tr>
  <tr><th>Rekomandimet u zbatuan</th><td>${d.recsDone?"Po":"Jo"}</td><th>Vëzhgim rishikues</th><td>${d.followup?"Po":"Jo"}</td></tr></table>
  <div class="sig"><div>Nëndrejtori (Mendim Mera)</div><div>Mësuesi/ja: ${esc(teacher)}</div></div></div>`+(sf?selfPage(sf,teacher,sc.pct):"");
}
function selfPage(sf,teacher,obsPct){
  const sp=selfScore(sf);
  return `<div class="page"><h1>Vetëvlerësimi i mësuesit pas orës</h1><div class="sm">${esc(teacher)} · ${esc(sf.subject)} · ${esc(sf.klasa)} · ${esc(fmtShort(sf.date))}${sf.by==="nëndrejtori"?" · plotësuar nga nëndrejtori":""}</div>
  <table><tr><th>Tema e orës</th><td>${esc(sf.tema)}</td></tr></table>
  <table><tr><th>Pohimi</th><th class="num">Niveli</th></tr>${SELF_ITEMS.map(([k,t])=>`<tr><td>${esc(t)}</td><td class="num">${lvLabel(sf[k])}</td></tr>`).join("")}
  <tr class="gh"><td>Vetëvlerësimi i përgjithshëm${obsPct==null?"":" (vëzhgimi: "+obsPct+"%)"}</td><td class="num">${sp==null?"–":sp+"%"}</td></tr></table>
  ${SELF_TEXTS.map(([k,t])=>`<h3>${esc(t)}</h3><div class="box">${nl(sf[k])}</div>`).join("")}
  <div class="sig"><div>Mësuesi/ja: ${esc(teacher)}</div><div>Nëndrejtori</div></div></div>`;
}
function summaryTable(list){
  return `<table><tr><th>Data</th><th>Mësuesi/ja</th><th>Lënda</th><th>Klasa</th><th>Shkolla</th><th>Gjendja</th><th class="num">Rezultati</th></tr>${list.map(o=>{const sc=scoreOf(o.doc);return `<tr><td>${esc(fmtShort(o.date))}</td><td>${esc(o.teacher)}</td><td>${esc(o.subject)}</td><td>${esc(o.klasa)}</td><td>${esc(o.shift)}</td><td>${esc(STAT[statusOf(o)][0])}</td><td class="num">${sc.pct==null?"–":sc.pct+"% · "+levelOf(sc.pct)}</td></tr>`;}).join("")}</table>`;
}
function doneObs(list){return list.filter(o=>o.doc.status==="kryer"||(o.doc.scores&&Object.keys(o.doc.scores).length));}
function taskTable(list){return `<table><tr><th>Veprimtaria</th><th>Afati</th><th>Prova</th><th>Gjendja</th><th>Shënim</th></tr>${list.map(t=>{const d=state.taskDocs[t.id]||{};return `<tr><td>${esc(t.t)}</td><td>${esc(t.k)}</td><td>${esc(t.p)}</td><td>${d.done?"Kryer "+esc(fmtShort(d.doneOn)):esc(taskStatus(t)[0])}</td><td>${esc(d.note)}</td></tr>`;}).join("")}</table>`;}
function fullDossier(){
  const obs=allObs();
  const groups=[...new Set(TASKS.map(t=>t.g))];
  const mrows=MCLASSES.map(c=>{const d=state.matDocs[mkey(c)]||{steps:{}};return `<tr><td>${esc(c)}</td>${MSTEPS.map(([k])=>`<td class="num">${d.steps&&d.steps[k]?"✓":"–"}</td>`).join("")}<td>${esc(d.note)}</td></tr>`;}).join("");
  return `<div class="page"><h1>Dosja e nëndrejtorit</h1><div class="sm">Gjimnazi "Said Najdeni", Peshkopi · viti shkollor 2026–2027</div>
  <p>Nëndrejtor: Mendim Mera · Përgatitur më ${esc(fmtShort(today()))}</p>
  <h2>Grafiku i monitorimit të orëve mësimore</h2>${summaryTable(obs)}</div>`+
  doneObs(obs).map(o=>obsPage(o,{...o.doc,date:o.date,klasa:o.klasa,ora:o.ora,shift:o.shift},state.selfForms[o.id])).join("")+
  `<div class="page"><h1>Veprimtaritë e planit vjetor</h1>${groups.map(g=>`<h2>${esc(g)}</h2>${taskTable(TASKS.filter(t=>t.g===g))}`).join("")}
  <h2>Matura Shtetërore: ecuria sipas klasave</h2><table><tr><th>Klasa</th>${MSTEPS.map(s=>`<th class="num">${esc(s[1])}</th>`).join("")}<th>Shënim</th></tr>${mrows}</table></div>`;
}
function teacherDossier(t){
  const mine=allObs().filter(o=>o.teacher===t);
  return `<div class="page"><h1>Dosja e monitorimit: ${esc(t)}</h1><div class="sm">Gjimnazi "Said Najdeni", Peshkopi · viti shkollor 2026–2027 · ${esc((TEACHERS[t]||[]).join(", "))}</div>
  <h2>Vëzhgimet</h2>${summaryTable(mine)}</div>`+
  doneObs(mine).map(o=>obsPage(o,{...o.doc,date:o.date,klasa:o.klasa,ora:o.ora,shift:o.shift},state.selfForms[o.id])).join("");
}
async function exportCsv(){
  if(!dlcap){toast("Shkarkimi nuk është i disponueshëm në këtë pamje.");return;}
  const q=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
  const head=["Data","Mësuesi","Lënda","Klasa","Ora","Shkolla","Gjendja","Rezultati %","Niveli","Pikat e forta","Për përmirësim","Rekomandime","Diskutuar më","Afati","Zbatuar","Vetëvlerësimi %"];
  const lines=[head.map(q).join(",")];
  allObs().forEach(o=>{const sc=scoreOf(o.doc);lines.push([fmtShort(o.date),o.teacher,o.subject,o.klasa,o.ora,o.shift,STAT[statusOf(o)][0],sc.pct??"",levelOf(sc.pct)||"",o.doc.strengths,o.doc.improve,o.doc.recs,o.doc.discussedOn,o.doc.recsDue,o.doc.recsDone?"po":"",selfScore(state.selfForms[o.id])??""].map(q).join(","));});
  try{await dlcap.save({filename:"vezhgimet-2026-2027.csv",data:"﻿"+lines.join("\n")});}catch(e){if(!e||e.code!=="declined")toast("Skedari nuk u ruajt. "+errText(e));}
}

/* ---------- Kodi i vetëvlerësimit (mësuesi) dhe importi (nëndrejtori) ---------- */
function encCode(id,data){return "VETEV1:"+btoa(unescape(encodeURIComponent(JSON.stringify({id,data}))));}
function decCode(t){
  t=String(t||"").trim();
  if(t[0]==="{")return JSON.parse(t);
  const m=t.match(/VETEV1:([A-Za-z0-9+\/=]+)/);if(!m)throw new Error("Kodi nuk njihet.");
  return JSON.parse(decodeURIComponent(escape(atob(m[1]))));
}
function showCode(id,data){
  const code=encCode(id,data);
  const old=$("#codeBox");if(old)old.remove();
  const box=document.createElement("section");box.id="codeBox";box.className="panel";box.style.cssText="margin-top:12px;max-width:760px";
  box.innerHTML='<h3>Dërgoja nëndrejtorit</h3><p class="sub" style="margin:4px 0 8px">Kopjo kodin dhe dërgoje me WhatsApp, Viber ose email, ose shkarko skedarin dhe dërgoje si bashkëngjitje.</p><textarea id="codeTa" readonly rows="4" style="width:100%;font-family:var(--mono);font-size:12px"></textarea><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary small" id="codeCopy">Kopjo kodin</button><button class="btn small" id="codeDl">Shkarko skedarin</button></div>';
  view.appendChild(box);
  const ta=$("#codeTa");ta.value=code;
  $("#codeCopy").onclick=async()=>{try{await navigator.clipboard.writeText(code);toast("Kodi u kopjua.");}catch(e){ta.focus();ta.select();toast("Zgjidhe kodin dhe kopjoje me Ctrl+C.");}};
  $("#codeDl").onclick=()=>dlcap.save({filename:"vetevleresim-"+slug(data.teacher)+"-"+(data.date||"")+".json",data:JSON.stringify({id,data})});
  box.scrollIntoView({behavior:"smooth",block:"nearest"});
}
async function importSelf(obj){
  const id=obj&&obj.id,d=obj&&obj.data;
  if(typeof id!=="string"||!d||typeof d!=="object")throw new Error("Formati nuk është i vlefshëm.");
  if(!PLAN_OBS.some(r=>r[0]===id)&&!state.obsDocs[id])throw new Error("Vëzhgimi "+id+" nuk ekziston në këtë regjistër.");
  const str=(v,n)=>String(v==null?"":v).slice(0,n);
  const c={teacher:str(d.teacher,80),subject:str(d.subject,40),klasa:str(d.klasa,20),date:str(d.date,10),tema:str(d.tema,300),at:str(d.at,40)||new Date().toISOString(),by:"mësuesi"};
  SELF_ITEMS.forEach(([k])=>{const v=+d[k];if(v>=1&&v<=4)c[k]=v;});
  SELF_TEXTS.forEach(([k])=>{c[k]=str(d[k],2000);});
  await db.collection("selfeval").doc("imp-"+id).set({forms:{[id]:c}});
  return c;
}
function backupAll(){
  const items={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(window.__BK.P))items[k]=localStorage.getItem(k);}
  return JSON.stringify({v:1,saved:new Date().toISOString(),items});
}
function openDataDialog(){
  let dlg=$("#dataDlg");if(dlg)dlg.remove();
  dlg=document.createElement("dialog");dlg.id="dataDlg";
  dlg.style.cssText="max-width:560px;width:calc(100% - 32px);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:18px";
  dlg.innerHTML='<h2>Importo vetëvlerësim nga mësuesi</h2><p class="sub" style="margin:0 0 8px">Ngjit kodin që të dërgoi mësuesi, ose zgjidh skedarin(et) .json.</p><textarea id="impTa" rows="3" style="width:100%;font-family:var(--mono);font-size:12px" placeholder="VETEV1:…"></textarea><input type="file" id="impFile" accept=".json,application/json" multiple style="margin-top:8px"><div style="margin-top:8px"><button class="btn primary small" id="impGo">Importo</button> <span class="msg" id="impMsg"></span></div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><h2>Kopje rezervë</h2><p class="sub" style="margin:0 0 8px">Të gjitha të dhënat ruhen vetëm në këtë shfletues. Shkarko një kopje rregullisht dhe ruaje diku tjetër.</p><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn small" id="bkGo">Shkarko kopjen rezervë</button><label class="btn small" style="cursor:pointer">Rikthe nga kopja<input type="file" id="bkFile" accept=".json,application/json" hidden></label></div><p class="msg" id="bkMsg" style="margin-top:8px"></p><div style="text-align:right;margin-top:12px"><button class="btn small" id="dlgClose">Mbyll</button></div>';
  document.body.appendChild(dlg);dlg.showModal();
  $("#dlgClose").onclick=()=>dlg.close();
  $("#impGo").onclick=async()=>{
    const m=$("#impMsg");m.className="msg";let n=0,bad=[];
    const texts=[];const t=$("#impTa").value.trim();if(t)texts.push(t);
    for(const f of $("#impFile").files)texts.push(await f.text());
    if(!texts.length){m.className="msg err";m.textContent="Ngjit një kod ose zgjidh një skedar.";return;}
    for(const x of texts){try{await importSelf(decCode(x));n++;}catch(e){bad.push(e.message||String(e));}}
    m.className="msg "+(bad.length?"err":"ok");m.textContent=n+" u importuan"+(bad.length?"; gabim: "+bad[0]:".");
    if(n){$("#impTa").value="";$("#impFile").value="";}
  };
  $("#bkGo").onclick=()=>dlcap.save({filename:"regjistri-kopje-rezerve-"+today()+".json",data:backupAll()});
  $("#bkFile").onchange=async e=>{
    const m=$("#bkMsg");const f=e.target.files[0];if(!f)return;
    try{
      const o=JSON.parse(await f.text());
      if(!o||!o.items||typeof o.items!=="object")throw new Error("Skedari nuk është kopje rezervë e këtij regjistri.");
      const keys=Object.keys(o.items);if(!keys.length||keys.some(k=>!k.startsWith(window.__BK.P)))throw new Error("Skedari nuk është kopje rezervë e këtij regjistri.");
      if(!confirm("Kjo zëvendëson të gjitha të dhënat aktuale me ato të kopjes. Të vazhdoj?"))return;
      const rm=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(window.__BK.P))rm.push(k);}
      rm.forEach(k=>localStorage.removeItem(k));keys.forEach(k=>localStorage.setItem(k,o.items[k]));
      location.reload();
    }catch(err){m.className="msg err";m.textContent=err.message||String(err);}
  };
}
$("#dataBtn").onclick=openDataDialog;

/* ---------- Nisja ---------- */
function route(){const h=location.hash.slice(1);state.vv=null;
  if(h.startsWith("vv-"))state.vv=h.slice(3);else if(h.startsWith("mesues-"))state.vv=h.slice(7);else if(["pasqyra","monitorimi","veprimtarite","matura","mesuesit"].includes(h))state.tab=h;}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.vv=null;state.openObj=null;state.draft=null;history.replaceState(null,"","#"+state.tab);render();});
window.addEventListener("hashchange",()=>{route();state.openObj=null;render();});
route();render();
$("#exportBtn").onclick=exportCsv;
$("#dossierBtn").onclick=()=>downloadHtml("dosja-nendrejtori-2026-2027.html",docShell("Dosja e nëndrejtorit 2026–2027",fullDossier()));

(async()=>{
  try{
    db=await claude.use("db");user=await claude.use("user");dlcap=await claude.use("downloads");
    if(dlcap){$("#exportBtn").hidden=false;$("#dossierBtn").hidden=false;}
    if(window.__FB_AUTH&&!window.__TEACHER&&db){const b=document.createElement("button");b.className="btn small";b.textContent="Dil";b.onclick=()=>window.__FB_AUTH.signOut().then(()=>location.reload());$("#hdrbtns").appendChild(b);}
    if(window.__STANDALONE&&!window.__TEACHER){$("#dataBtn").hidden=false;$("#banner").innerHTML='<div class="banner">Të dhënat ruhen vetëm në këtë shfletues e pajisje. Bëj kopje rezervë herë pas here nga butoni «Të dhënat».</div>';}
  }catch(e){console.error(e);db=null;}
  let admin=false;
  try{admin=user?await user.canEdit():false;}catch(e){admin=false;}
  state.isAdmin=!!admin;
  if(!db){$("#banner").innerHTML='<div class="banner">'+(window.__FBERR?"Lidhja me Firebase dështoi: "+esc(window.__FBERR):"Ruajtja nuk është e lidhur.")+'</div>';}
  render();
  if(!db||!admin)return;
  const timer=setTimeout(()=>{if(!(state.loaded.obs&&state.loaded.tasks&&state.loaded.mat))toast("Të dhënat e ruajtura nuk arrijnë dot të ngarkohen tani. Mund të jenë të vjetra.");},10000);
  const sub=(coll,key,store)=>db.collection(coll).onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>m[d.id]=d.data());state[store]=m;if(key)state.loaded[key]=true;
    if(!state.loaded.obs||!state.loaded.tasks||!state.loaded.mat||(state.loaded.obs&&state.loaded.tasks&&state.loaded.mat))clearTimeout(timer);
    if(!state.openObj&&!state.vv)render();
  },e=>{if(key)state.loaded[key]=true;if(e&&e.code!=="revoked")toast("Gabim leximi ("+(e.code||"")+").");});
  sub("obs","obs","obsDocs");sub("tasks","tasks","taskDocs");sub("matura","mat","matDocs");
  db.collection("selfeval").onSnapshot(snap=>{
    const forms={};
    snap.docs.forEach(d=>{const fs=(d.data()||{}).forms||{};for(const[oid,f]of Object.entries(fs)){if(!forms[oid]||String(f.at||"")>String(forms[oid].at||""))forms[oid]=f;}});
    state.selfForms=forms;if(!state.openObj&&!state.vv)render();
  },e=>{if(e&&e.code!=="revoked")toast("Gabim leximi i vetëvlerësimeve ("+(e.code||"")+").");});
})();
</script>
